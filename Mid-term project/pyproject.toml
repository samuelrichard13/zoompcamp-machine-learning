[project]
name = "mid-term-project"
version = "0.1.0"
description = "Mid term project : Sleep score prediciton"
readme = "README.md"
authors = [
    { name = "samuelrichard13", email = "samuelrichard205@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.2",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
mid-term-project = "mid_term_project:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "requests>=2.34.2",
]
